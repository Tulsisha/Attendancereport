<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Employee Attendance Portal</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #072147 0%, #0c3574 50%, #03142e 100%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-card {
      max-width: 600px;
      width: 100%;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      padding: 30px;
      text-align: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .auth-header img {
      max-width: 160px;
      height: auto;
      margin-bottom: 12px;
    }

    .auth-body {
      padding: 30px;
    }

    .btn-register {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      height: 50px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-register:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="auth-header">
      {% load static %}
      <img src="{% static 'images/krishny-logo.png' %}" alt="Logo" onerror="this.src='{% static 'images/logo.png' %}'">
      <h4 class="fw-bold mb-1" style="color: #072147;">Create Employee Account</h4>
      <p class="text-muted small mb-0">Register your profile for biometric attendance & shift logging</p>
    </div>

    <div class="auth-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form action="{% url 'registeruser' %}" method="POST">
        {% csrf_token %}

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-semibold">Username *</label>
            <input type="text" name="username" class="form-control" required placeholder="Choose username" autofocus>
          </div>
          <div class="col-6">
            <label class="form-label small fw-semibold">Password *</label>
            <input type="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 chars">
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-semibold">First Name</label>
            <input type="text" name="first_name" class="form-control" placeholder="First name">
          </div>
          <div class="col-6">
            <label class="form-label small fw-semibold">Last Name</label>
            <input type="text" name="last_name" class="form-control" placeholder="Last name">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Work Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="name@company.com">
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-semibold">Department</label>
            <select name="department" class="form-select">
              <option value="">Select Department</option>
              {% for d in departments %}
                <option value="{{ d.id }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-semibold">Designation</label>
            <input type="text" name="designation" class="form-control" placeholder="e.g. Developer">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Contact Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="+91 ...">
        </div>

        <button type="submit" class="btn btn-register w-100 mb-3">
          <i class="bi bi-person-check-fill me-1"></i> Register Employee Account
        </button>
      </form>

      <div class="text-center mt-2">
        <span class="text-muted small">Already have an account?</span>
        <a href="{% url 'loginn' %}" class="fw-bold text-primary text-decoration-none small ms-1">Login Here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
